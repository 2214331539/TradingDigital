services:
  postgres:
    image: postgres:16-alpine
    container_name: tradedigital-postgres
    environment:
      POSTGRES_DB: tradedigital
      POSTGRES_USER: tradedigital
      POSTGRES_PASSWORD: tradedigital
    ports:
      - "${POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - tradedigital_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradedigital -d tradedigital"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: tradedigital-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-tradedigital.json:/opt/keycloak/data/import/realm-tradedigital.json:ro

volumes:
  tradedigital_postgres:
