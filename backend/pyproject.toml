[project]
name = "tradedigital-backend"
version = "0.1.0"
description = "TradeDigital FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.41",
    "pydantic-settings==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pyjwt==2.10.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "email-validator==2.2.0",
    "openai>=2.44.0",
    "python-dotenv>=1.2.1",
    "asyncpg>=0.31.0",
    "alembic>=1.16.5",
    "authlib>=1.6.12",
    "itsdangerous>=2.2.0",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
