[alembic]
script_location = migrations
prepend_sys_path = .

# Each module owns its own migration history (independent Alembic branch).
# `alembic upgrade heads` applies all branches; on module extraction the folder
# moves with the module.
version_path_separator = space
version_locations = %(here)s/src/tradedigital/platform/migrations/versions %(here)s/src/tradedigital/apps/llm/migrations/versions %(here)s/src/tradedigital/apps/knowledge/migrations/versions

sqlalchemy.url = postgresql+asyncpg://tradedigital:tradedigital@127.0.0.1:5432/tradedigital

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

